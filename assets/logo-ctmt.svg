<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">CTMT Boxe</title>
  <desc id="desc">Emblema circular metálico vermelho, preto e prata do CTMT Boxe</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1efef"/>
      <stop offset=".25" stop-color="#716d73"/>
      <stop offset=".5" stop-color="#cdc9ce"/>
      <stop offset=".72" stop-color="#48454a"/>
      <stop offset="1" stop-color="#f1efef"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e77062"/>
      <stop offset=".45" stop-color="#d9211b"/>
      <stop offset="1" stop-color="#811012"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f090a" flood-opacity=".7"/>
    </filter>
  </defs>
  <circle cx="90" cy="90" r="84" fill="url(#metal)" filter="url(#shadow)"/>
  <circle cx="90" cy="90" r="74" fill="#0f090a" stroke="#d9211b" stroke-width="5"/>
  <circle cx="90" cy="90" r="62" fill="#252225" stroke="#cdc9ce" stroke-width="2"/>
  <path d="M31 71h118M29 118h122" stroke="#d9211b" stroke-width="10" opacity=".95"/>
  <path d="M30 70h120M30 116h120" stroke="#f1efef" stroke-width="2" opacity=".75"/>
  <text x="90" y="45" fill="#f1efef" font-family="Arial Black,Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="1.7">MUAY THAI</text>
  <text x="90" y="99" fill="url(#red)" stroke="#0f090a" stroke-width="3" paint-order="stroke" font-family="Arial Black,Arial,sans-serif" font-size="49" font-weight="900" text-anchor="middle" letter-spacing="-3">CTMT</text>
  <text x="90" y="130" fill="#f1efef" stroke="#0f090a" stroke-width="2" paint-order="stroke" font-family="Arial Black,Arial,sans-serif" font-size="25" font-weight="900" text-anchor="middle" letter-spacing="2">BOXE</text>
</svg>
